<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Prompt", system-ui, sans-serif;
    background: linear-gradient(180deg, #ffffff 0%, #fff6f9 55%, #ffeef4 100%);
    background-attachment: fixed;
    color: #3a2a30;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    text-align: center;
    padding: 48px 20px 40px;
    padding-top: max(48px, env(safe-area-inset-top));
    padding-bottom: max(40px, env(safe-area-inset-bottom));
  }
  h1 {
    font-size: clamp(3rem, 14vw, 7rem);
    font-weight: 800;
    letter-spacing: 0.02em;
    line-height: 1;
  }
  .wish {
    font-size: clamp(3.5rem, 18vw, 9rem);
    font-weight: 800;
    line-height: 1.1;
    color: #e0568a;
    margin-top: 16px;
    min-height: 1.2em;
    opacity: 0;
    transform: scale(0.6);
  }
  .wish.show {
    opacity: 1;
    transform: scale(1);
    transition: opacity .4s ease, transform .5s cubic-bezier(.2,1.4,.4,1);
  }
  main { display: flex; flex-direction: column; align-items: center; width: 100%; }
  img {
    width: min(320px, 78vw);
    height: auto;
    margin-top: 24px;
  }
  button {
    font: inherit;
    font-weight: 600;
    font-size: 1.15rem;
    padding: 14px 40px;
    border: 0;
    border-radius: 999px;
    background: #f27aa5;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(242,122,165,.35);
    transition: transform .15s ease, background .15s ease;
  }
  button:hover { background: #ea6795; }
  button:active { transform: scale(.95); }
  button:focus-visible { outline: 3px solid #3a2a30; outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    .wish.show { transition: none; }
  }
</style>
